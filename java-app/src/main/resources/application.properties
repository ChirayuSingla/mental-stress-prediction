# ---------- Database ----------
# Zero-install demo alternative (embedded H2, file-based, schema auto-created):
db.url=jdbc:h2:./data/stressdb;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE
db.user=sa
db.password=
# MySQL (optional alternative if local MySQL server is configured):
# db.url=jdbc:mysql://localhost:3306/stress_prediction?useSSL=false&serverTimezone=UTC
# db.user=root
# db.password=

# ---------- ML service ----------
ml.base.url=http://127.0.0.1:8000
ml.timeout.ms=4000

# ---------- Monitoring ----------
monitor.window.seconds=60
monitor.idle.threshold.seconds=20
baseline.calibration.sessions=3
baseline.min.windows=30

# ---------- Modes ----------
# real = live monitoring of the consenting user (production mode)
# demo = synthetic simulation (labeled as non-production demo only)
app.mode=real
app.participant.code=P001

# ---------- Background & Notification Settings ----------
# Minimize to system tray and keep background monitoring active on window close
app.tray.enabled=true
# Minimum cooldown between high-stress alert popups (seconds; demo default: 20, real default: 300)
notification.cooldown.seconds=120
# User alert preference only; not a validated stress category or clinical threshold.
notification.high.stress.threshold=6.0

